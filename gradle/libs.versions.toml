# Version catalog — single source of truth for dependency versions across the workspace.
# The :sdk submodule manages its own versions internally; these entries are for
# workspace projects that depend on :sdk and need to reference the same versions.

[versions]
grpc        = "1.62.2"
protobuf    = "4.26.1"
junixsocket = "2.9.1"
moquette    = "0.17"
gson        = "2.14.0"

[libraries]
grpc-okhttp          = { module = "io.grpc:grpc-okhttp",           version.ref = "grpc" }
grpc-protobuf-lite   = { module = "io.grpc:grpc-protobuf-lite",    version.ref = "grpc" }
grpc-stub            = { module = "io.grpc:grpc-stub",             version.ref = "grpc" }
protobuf-javalite    = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
junixsocket-core     = { module = "com.kohlschutter.junixsocket:junixsocket-core", version.ref = "junixsocket" }
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }
moquette-broker      = { module = "io.moquette:moquette-broker", version.ref = "moquette" }
gson                 = { module = "com.google.code.gson:gson", version.ref = "gson" }
